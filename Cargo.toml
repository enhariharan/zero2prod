[package]
name = "zero2prod"
version = "0.1.0"
authors = [
    "Luca Palmieri <contact@lpalmieri.com>",
    "Hariharan Narayanan <enhariharan@gmail.com>",
]
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "zero2prod"

[dependencies]
actix-web = "4"
anyhow = "1"
base64 = "0.22"
chrono = {  version = "0.4.44", default-features = false, features = ["clock"] }
config = "0.15.23"
rand = { version = "0.8", features = ["std_rng"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde-aux = { version = "4" }
thiserror = "2.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = { version = "0.1", features = ["log"] }
tracing-actix-web = "0.7"
tracing-bunyan-formatter = {version = "0.3"}
tracing-log = "0.1.4"
tracing-subscriber = {version = "0.3", features = ["registry", "env-filter"]}
unicode-segmentation = "1"
uuid = { version = "1", features = ["v4"] }
validator = "0.20"

[dependencies.sqlx]
version = "0.8"
default-features = false
features = [
    "runtime-tokio-rustls",
    "macros",
    "postgres",
    "uuid",
    "chrono",
    "migrate"
]

[dev-dependencies]
claims = "0.7"
fake = "5.1"
linkify = "0.11"
quickcheck = "1.1"
quickcheck_macros = "1.2"
serde_json = "1.0"
tokio = { version = "1.52", features = ["rt", "macros"] }
wiremock = "0.6"
